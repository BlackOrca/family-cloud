services:
  familycloud-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  radicale-auth-init:
    image: "busybox:latest"
    command:
      - "-c"
      - "mkdir -p /auth && [ -f /auth/users ] || touch /auth/users"
    entrypoint:
      - "sh"
    volumes:
      - type: "bind"
        target: "/auth"
        source: "./data/radicale-auth"
    networks:
      - "aspire"
    restart: "no"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "bind"
        target: "/var/lib/postgresql/data"
        source: "./data/postgres"
    networks:
      - "aspire"
    restart: "unless-stopped"
  radicale:
    image: "tomsquest/docker-radicale:latest"
    environment:
      TZ: "Europe/Berlin"
    expose:
      - "5232"
    volumes:
      - type: "bind"
        target: "/data"
        source: "./data/radicale"
      - type: "bind"
        target: "/config/config"
        source: "./radicale/config"
        read_only: true
      - type: "bind"
        target: "/auth"
        source: "./data/radicale-auth"
    depends_on:
      radicale-auth-init:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
    restart: "unless-stopped"
  immich-postgres:
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${IMMICH_POSTGRES_PASSWORD}"
      POSTGRES_DB: "immich"
    expose:
      - "5432"
    volumes:
      - type: "bind"
        target: "/var/lib/postgresql/data"
        source: "./data/immich-postgres"
    networks:
      - "aspire"
    restart: "unless-stopped"
  immich-redis:
    image: "docker.io/valkey/valkey:9"
    networks:
      - "aspire"
    restart: "unless-stopped"
  immich-machine-learning:
    image: "ghcr.io/immich-app/immich-machine-learning:release"
    volumes:
      - type: "bind"
        target: "/cache"
        source: "./data/immich-model-cache"
    networks:
      - "aspire"
    restart: "unless-stopped"
  immich-server:
    image: "ghcr.io/immich-app/immich-server:release"
    environment:
      DB_HOSTNAME: "immich-postgres"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "${IMMICH_POSTGRES_PASSWORD}"
      DB_DATABASE_NAME: "immich"
      REDIS_HOSTNAME: "immich-redis"
      TZ: "Europe/Berlin"
      IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
    expose:
      - "2283"
    volumes:
      - type: "bind"
        target: "/data"
        source: "./data/immich-uploads"
    depends_on:
      immich-postgres:
        condition: "service_started"
      immich-redis:
        condition: "service_started"
      immich-machine-learning:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
  server:
    image: "${SERVER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVER_PORT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=familycloud"
      DEFAULTCONNECTION_HOST: "postgres"
      DEFAULTCONNECTION_PORT: "5432"
      DEFAULTCONNECTION_USERNAME: "postgres"
      DEFAULTCONNECTION_PASSWORD: "${POSTGRES_PASSWORD}"
      DEFAULTCONNECTION_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/familycloud"
      DEFAULTCONNECTION_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/familycloud"
      DEFAULTCONNECTION_DATABASENAME: "familycloud"
      DataDirectory: "/data"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      SeedAdmin__UserName: "${SEED_ADMIN_USERNAME}"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD}"
      Radicale__BaseUrl: "http://radicale:5232/"
      Radicale__HtpasswdPath: "/radicale-auth/users"
      Immich__BaseUrl: "http://immich-server:2283/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://familycloud-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "server"
    ports:
      - "5253:${SERVER_PORT}"
    expose:
      - "${SERVER_PORT}"
    volumes:
      - type: "bind"
        target: "/data"
        source: "./data/server"
      - type: "bind"
        target: "/radicale-auth"
        source: "./data/radicale-auth"
    depends_on:
      radicale:
        condition: "service_started"
      immich-server:
        condition: "service_started"
      postgres:
        condition: "service_started"
    user: "0:0"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
